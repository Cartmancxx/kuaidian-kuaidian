name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
  DOTNET_NOLOGO: '1'
jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build and run core tests
        run: |
          dotnet build ShopController/host/ShopController.Host.csproj -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project ShopController.Tests/ShopController.Tests.csproj -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Native protocol and isolated platform tests
        run: |
          foreach ($test in @('protocol_tests.py','identity_tests.py','pinning_tests.py')) {
            python "ShopController.Tests/$test" --no-build
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          foreach ($test in @('platform_tests.py','installer_tests.py','public_source_tests.py','release_policy_tests.py')) {
            python "ShopController.Tests/$test"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Extension logic tests
        run: |
          foreach ($test in @('api_tests.cjs','default_pin_tests.cjs','launcher_tests.cjs','setup_tests.cjs')) {
            node "ShopController.Tests/$test"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Report test boundary
        run: |
          'These tests use isolated fixtures. They do not install the helper, register a native host, start Chrome, test merchant login, or validate OS code signing.' >> $env:GITHUB_STEP_SUMMARY

