<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>快店快点 · 小窗展示</title><style>*{box-sizing:border-box}body{margin:0;width:1280px;height:800px;overflow:hidden;background:#f2f6f3;color:#243d32;font-family:"Segoe UI","Microsoft YaHei",sans-serif}.canvas{height:100%;padding:70px 85px;display:flex;align-items:center;gap:100px}.copy{width:555px}.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:650;margin-bottom:42px}.brand img{width:48px;height:48px}h1{font-size:43px;line-height:1.45;letter-spacing:-.03em;margin:0 0 24px;font-weight:650}.intro{font-size:17px;color:#728279;line-height:1.9;max-width:470px}.points{margin:30px 0 0;padding-left:18px;color:#526d5b;font-size:15px;line-height:2.35}.window{flex:none;width:322px;background:#fff;border:1px solid #dce6df;border-radius:12px;overflow:hidden;box-shadow:0 25px 65px #244f3b17}.bar{height:32px;display:flex;align-items:center;gap:6px;padding:0 12px;background:#f6f8f6;border-bottom:1px solid #e9eeeb}.dot{width:7px;height:7px;border-radius:50%;background:#d6ded8}.bar span:last-child{font-size:10px;color:#8c9a90;margin-left:auto}iframe{border:0;display:block;width:320px;height:350px}.caption{text-align:center;margin-top:18px;color:#8b9990;font-size:11px}.note{position:absolute;bottom:38px;left:85px;font-size:12px;color:#839488}</style></head><body><main class="canvas"><section class="copy"><div class="brand"><img src="icons/icon128.png" alt="">快店快点</div><h1>店铺一眼找到，<br>后台一点打开。</h1><p class="intro">一个紧凑小窗，按店铺找到对应的 Chrome 资料。日常点店名，设置才进管理页。</p><ul class="points"><li>按平台分组，一家店铺一行</li><li>后台继续使用原生 Chrome</li><li>不读取或搬运 Cookie</li></ul></section><section><div class="window"><div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span>独立小窗</span></div><iframe src="popup.html?window=1" title="小窗实际界面（示例数据）"></iframe></div><p class="caption">实际页面渲染 · 示例数据</p></section></main><p class="note">需要配套本地助手 · Windows 支持置顶 · Mac 使用普通独立小窗</p></body></html>
